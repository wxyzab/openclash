custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

; --- Cloudflare ---
custom_proxy_group=☁️ cloudflare`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

; --- Microsoft ---
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default


; ==========================================================
; 4) Default / 漏网之鱼
; ==========================================================

; --- 兜底节点 ---
custom_proxy_group=🚀 兜底节点`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]DIRECT

; --- Default ---
custom_proxy_group=🌐 Default`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🧭 全部节点`[]DIRECT

; --- 漏网之鱼 ---
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🚀 兜底节点


; ==========================================================
; 5) 非标端口兜底
; ==========================================================

custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 6) 国家节点测速组
; interval=300s
; tolerance=100ms
; ==========================================================

; --- 全节点手动 ---
custom_proxy_group=🧭 全部节点`select`.*

; --- 全节点自动 ---
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,100

; --- 香港 ---
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\bHK\b|hongkong)`https://www.gstatic.com/generate_204`300,,100

; --- 台湾 ---
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet)`https://www.gstatic.com/generate_204`300,,100

; --- 日本 ---
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\bJP\b|tokyo|osaka)`https://www.gstatic.com/generate_204`300,,100

; --- 新加坡 ---
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\bSG\b|singapore)`https://www.gstatic.com/generate_204`300,,100

; --- 美国 ---
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\bUS\b|united states|los angeles|san jose|seattle|new york)`https://www.gstatic.com/generate_204`300,,100


; ==========================================================
; 7) 冷门节点
; 排除 HK / JP / TW / SG / US
; ==========================================================

custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\bHK\b|hong\s*kong|🇯🇵|日本|\bJP\b|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|singapore|🇺🇸|美国|\bUS\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york)).*$
